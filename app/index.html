<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Jeeves TV</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%}
#m{position:fixed;left:40px;bottom:30px;color:#888;font:24px sans-serif}</style></head>
<body><div id="m">Connecting to jeeves-hub…</div><iframe id="f" allow="autoplay"></iframe>
<script>
// Thin shell: everything visible lives on jeeves-hub. The shell only bridges Tizen APIs to the page.
var HUB='http://172.27.0.2:8774', f=document.getElementById('f');
function log(m){try{var x=new XMLHttpRequest();x.open('GET',HUB+'/log?m='+encodeURIComponent(m));x.send();}catch(e){}}
function reply(o){try{f.contentWindow.postMessage(o,'*');}catch(e){}}
var BR='http://127.0.0.1:8085';
function get(p,cb){var x=new XMLHttpRequest();x.open('GET',BR+p);x.timeout=8000;
  x.onload=function(){var r={};try{r=JSON.parse(x.responseText);}catch(e){}cb(r);};
  x.onerror=x.ontimeout=function(){cb({ok:false,err:'bridge unreachable'});};x.send();}
function apps(cb,n){get('/apps',function(r){
  if(r.ok)return cb(r.apps);
  if((n||0)<10)return setTimeout(function(){apps(cb,(n||0)+1);},1000);
  log('apps err '+r.err);cb([]);});}
window.addEventListener('message',function(ev){
  var d=ev.data||{};
  if(d.cmd==='launch'){
    get('/launch?id='+encodeURIComponent(d.appId),function(r){log('launch '+d.appId+' '+JSON.stringify(r));
      if(!r.ok)reply({cmd:'launchErr',appId:d.appId,err:r.err});});
  } else if(d.cmd==='apps'){apps(function(l){reply({cmd:'apps',apps:l});});}
  else if(d.cmd==='log'){log('page: '+d.m);}
  else if(d.cmd==='exit'){try{tizen.application.getCurrentApplication().exit();}catch(e){}}
});
f.onload=function(){document.getElementById('m').style.display='none';try{f.contentWindow.focus();}catch(e){}};
document.addEventListener('keydown',function(e){reply({cmd:'key',keyCode:e.keyCode});});
f.src=HUB+'/home.html?t='+Date.now();
log('shell up href='+location.href+' tizen='+(typeof tizen)+' webapis='+(typeof webapis)+' ua='+navigator.userAgent);
apps(function(l){log('apps '+l.length+': '+l.map(function(a){return a.id+'='+a.name;}).join(' | '));});
</script></body></html>
